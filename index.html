<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>分帳系統</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); padding: 20px; min-height: 100vh; }
    .container { max-width: 800px; margin: 0 auto; background: white; border-radius: 20px; box-shadow: 0 20px 60px rgba(0,0,0,0.3); overflow: hidden; }
    .header { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; padding: 30px; text-align: center; }
    .header h1 { font-size: 2.5em; margin-bottom: 10px; }
    .header p { opacity: 0.9; font-size: 1.1em; }
    .tabs { display: flex; background: #f5f5f5; border-bottom: 2px solid #e0e0e0; }
    .tab { flex: 1; padding: 20px; text-align: center; cursor: pointer; background: #f5f5f5; border: none; font-size: 1.1em; font-weight: 600; transition: all 0.3s; color: #666; }
    .tab:hover { background: #e8e8e8; }
    .tab.active { background: white; color: #667eea; border-bottom: 3px solid #667eea; }
    .tab-content { display: none; padding: 30px; }
    .tab-content.active { display: block; animation: fadeIn 0.3s; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    .form-group { margin-bottom: 20px; }
    .form-group label { display: block; margin-bottom: 8px; font-weight: 600; color: #333; }
    .form-group input, .form-group textarea { width: 100%; padding: 12px 15px; border: 2px solid #e0e0e0; border-radius: 8px; font-size: 1.1em; transition: all 0.3s; }
    .form-group input:focus, .form-group textarea:focus { outline: none; border-color: #667eea; box-shadow: 0 0 0 3px rgba(102,126,234,0.1); }
    .form-group textarea { resize: vertical; min-height: 60px; }
    .hint { font-size: 0.9em; color: #666; margin-top: 5px; background: #f0f0f0; padding: 10px; border-radius: 5px; }
    .hint strong { color: #28a745; }
    .hint .negative { color: #dc3545; }
    .btn { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; padding: 15px 30px; border: none; border-radius: 8px; font-size: 1.2em; font-weight: 600; cursor: pointer; transition: all 0.3s; width: 100%; margin-top: 10px; }
    .btn:hover { transform: translateY(-2px); box-shadow: 0 10px 20px rgba(102,126,234,0.3); }
    .btn:active { transform: translateY(0); }
    .btn-secondary { background: #6c757d; margin-top: 10px; font-size: 1em; padding: 10px 20px; }
    .btn-danger { background: #dc3545; }
    .records-container { margin-top: 20px; }
    .record-card { background: #f8f9fa; padding: 20px; margin-bottom: 15px; border-radius: 8px; transition: all 0.3s; border-left: 4px solid #667eea; }
    .record-card.paid-by-you { border-left-color: #28a745; }
    .record-card.paid-by-girlfriend { border-left-color: #ff6b9d; }
    .record-card:hover { box-shadow: 0 5px 15px rgba(0,0,0,0.1); transform: translateX(5px); }
    .record-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
    .record-title { font-size: 1.3em; font-weight: 700; color: #333; flex: 1; }
    .record-amount { font-size: 1.8em; font-weight: 700; margin-left: 20px; }
    .amount-positive { color: #ff6b9d; }
    .amount-negative { color: #28a745; }
    .record-details { color: #666; line-height: 1.6; }
    .record-details div { margin: 5px 0; }
    .balance-summary { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; padding: 30px; border-radius: 10px; margin-bottom: 20px; text-align: center; }
    .balance-amount { font-size: 3em; font-weight: 700; margin: 20px 0; }
    .balance-text { font-size: 1.5em; opacity: 0.95; }
    .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 15px; margin-top: 20px; }
    .stat-card { background: #f8f9fa; padding: 20px; border-radius: 10px; text-align: center; }
    .stat-card h3 { color: #666; font-size: 0.9em; margin-bottom: 10px; }
    .stat-card .value { font-size: 2em; font-weight: 700; }
    .stat-card.girlfriend { border: 2px solid #ff6b9d; }
    .stat-card.girlfriend .value { color: #ff6b9d; }
    .stat-card.you { border: 2px solid #28a745; }
    .stat-card.you .value { color: #28a745; }
    .loading { text-align: center; padding: 40px; color: #666; font-size: 1.2em; }
    .message { padding: 15px; margin: 15px 0; border-radius: 8px; font-weight: 500; }
    .message.success { background: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
    .message.error { background: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }
    .message.warning { background: #fff3cd; color: #856404; border: 1px solid #ffeeba; }
    .records-count { color: #666; margin-bottom: 10px; }
    .record-card { position: relative; }
    .btn-delete { margin-top: 10px; background: none; border: 1px solid #dc3545; color: #dc3545; border-radius: 6px; padding: 4px 12px; cursor: pointer; font-size: 0.9em; }
    .btn-delete:hover { background: #dc3545; color: white; }
    .btn-link { background: none; border: none; color: #155724; text-decoration: underline; cursor: pointer; font-size: 1em; font-weight: 600; margin-left: 8px; }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; box-shadow: none; }
    .batch-list { max-height: 300px; overflow-y: auto; background: #f8f9fa; padding: 10px 15px; border-radius: 8px; margin: 10px 0; }
    .batch-row { display: block; padding: 8px; border-bottom: 1px solid #e0e0e0; cursor: pointer; }
    .batch-row.duplicate { background: #fff8e1; }
    .dup-tag { white-space: nowrap; background: #ffc107; color: #333; font-size: 0.8em; padding: 2px 6px; border-radius: 4px; }
    @media (max-width: 768px) {
      .header h1 { font-size: 1.8em; }
      .tab { font-size: 0.9em; padding: 15px 10px; }
      .tab-content { padding: 20px; }
      .record-header { flex-direction: column; align-items: flex-start; }
      .record-amount { margin-left: 0; margin-top: 10px; }
      .balance-amount { font-size: 2em; }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>&#x1F491; 分帳系統</h1>
      <p>記錄你和女友的消費</p>
    </div>
    <div class="tabs">
      <button class="tab active" onclick="switchTab(0)">記帳</button>
      <button class="tab" onclick="switchTab(1)">批量導入</button>
      <button class="tab" onclick="switchTab(2)">記錄</button>
      <button class="tab" onclick="switchTab(3)">結算</button>
    </div>
    <!-- Tab 1: 記帳 -->
    <div class="tab-content active" id="tab-0">
      <h2 style="margin-bottom: 20px;">快速記帳</h2>
      <form id="addForm" onsubmit="handleAddRecord(event)">
        <div class="form-group">
          <label for="amount">金額</label>
          <input type="number" id="amount" required placeholder="正數=女友付，負數=你付" step="0.01">
          <div class="hint">
            <strong>正數（例如：500）</strong> = 女友付款，你欠女友<br>
            <span class="negative"><strong>負數（例如：-300）</strong> = 你付款，女友欠你</span>
          </div>
        </div>
        <div class="form-group">
          <label for="item">項目說明</label>
          <input type="text" id="item" required placeholder="例如：好市多、停車費、晚餐">
        </div>
        <div class="form-group">
          <label for="note">備註（選填）</label>
          <textarea id="note" placeholder="例如：公用、黑五特價"></textarea>
        </div>
        <button type="submit" class="btn">新增記錄</button>
      </form>
      <div id="addMessage"></div>
    </div>
    <!-- Tab 2: 批量導入 -->
    <div class="tab-content" id="tab-1">
      <h2 style="margin-bottom: 20px;">批量導入 LINE 記錄</h2>
      <div class="form-group">
        <label for="batchInput">貼上你的 LINE 記錄</label>
        <textarea id="batchInput" placeholder="直接貼上，每行一筆記錄，例如：&#10;370 公企中心停車&#10;-140 忠家雞排&#10;250牙膏跟足膜" style="min-height: 300px; font-family: monospace;"></textarea>
        <div class="hint">
          格式：每行開頭是金額（正數=女友付，負數=你付），後面接項目說明<br>
          例如：<strong>500 好市多</strong>、<strong>-300 晚餐</strong>、<strong>1,200 牙膏</strong><br>
          支援千分位逗號、全形數字與負號；LINE 匯出的時間、名字、日期行會自動略過<br>
          已經導入過的相同記錄會標示「可能重複」，預設不會再導入一次
        </div>
      </div>
      <button class="btn" onclick="handleBatchImport()">批量導入</button>
      <div id="batchMessage"></div>
      <div id="batchPreview"></div>
    </div>
    <!-- Tab 3: 記錄 -->
    <div class="tab-content" id="tab-2">
      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
        <h2>所有記錄</h2>
        <button class="btn btn-secondary" onclick="loadRecords()" style="width: auto; padding: 10px 20px;">重新整理</button>
      </div>
      <div id="recordsContainer" class="records-container">
        <div class="loading">載入中...</div>
      </div>
      <button class="btn btn-danger" onclick="clearRecords()" style="margin-top: 20px;">清除所有記錄</button>
    </div>
    <!-- Tab 4: 結算 -->
    <div class="tab-content" id="tab-3">
      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
        <h2>結算資訊</h2>
        <button class="btn btn-secondary" onclick="loadSettlement()" style="width: auto; padding: 10px 20px;">重新整理</button>
      </div>
      <div id="settlementContainer">
        <div class="loading">載入中...</div>
      </div>
    </div>
  </div>

  <script>
    var GIRLFRIEND_NAME = "女友";
    var YOUR_NAME = "你";
    var STORAGE_KEY = "splitRecords";

    // ---------- 工具 ----------
    function escapeHtml(str) {
      return String(str == null ? '' : str).replace(/[&<>"']/g, function(c) {
        return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
      });
    }

    // 金額一律以「分」(整數) 計算，避免浮點誤差
    function toCents(amount) { return Math.round(Number(amount) * 100) || 0; }
    function formatCents(cents) {
      return (Math.abs(cents) / 100).toLocaleString('zh-TW', { maximumFractionDigits: 2 });
    }

    function genId() {
      return Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
    }

    // ---------- 資料存取 ----------
    function getRecords() {
      var records;
      try {
        var data = localStorage.getItem(STORAGE_KEY);
        records = data ? JSON.parse(data) : [];
        if (!Array.isArray(records)) records = [];
      } catch (e) {
        return [];
      }
      // 舊資料沒有 id，補上以便刪除/撤銷
      var migrated = false;
      records.forEach(function(r) {
        if (!r.id) { r.id = genId(); migrated = true; }
      });
      if (migrated) saveRecords(records);
      return records;
    }

    function saveRecords(records) {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(records));
        return true;
      } catch (e) {
        alert('儲存失敗：' + e.message);
        return false;
      }
    }

    // 正數 = 女友付款（你欠女友）；負數 = 你付款（女友欠你）
    function buildRecord(signedAmount, item, note, batchId) {
      var girlfriendPaid = signedAmount > 0;
      var absAmount = Math.abs(signedAmount);
      var record = {
        id: genId(),
        date: new Date().toISOString(),
        item: item,
        amount: girlfriendPaid ? absAmount : -absAmount,
        payer: girlfriendPaid ? GIRLFRIEND_NAME : YOUR_NAME,
        splitDetails: [{ name: girlfriendPaid ? YOUR_NAME : GIRLFRIEND_NAME, amount: absAmount }],
        note: note || ''
      };
      if (batchId) record.batchId = batchId;
      return record;
    }

    function recordKey(r) {
      return toCents(r.amount) + '|' + String(r.item).trim();
    }

    // ---------- 結算 ----------
    function calculateSettlement() {
      var records = getRecords();
      var girlfriendPaid = 0, youPaid = 0, girlfriendCount = 0, youCount = 0;
      records.forEach(function(r) {
        var cents = Math.abs(toCents(r.amount));
        if (r.payer === GIRLFRIEND_NAME) { girlfriendPaid += cents; girlfriendCount++; }
        else { youPaid += cents; youCount++; }
      });
      return {
        count: records.length,
        girlfriendPaid: girlfriendPaid,
        youPaid: youPaid,
        girlfriendCount: girlfriendCount,
        youCount: youCount,
        // > 0：你欠女友；< 0：女友欠你
        net: girlfriendPaid - youPaid
      };
    }

    // ---------- 畫面 ----------
    function switchTab(index) {
      var tabs = document.querySelectorAll('.tab');
      var contents = document.querySelectorAll('.tab-content');
      tabs.forEach(function(tab, i) {
        if (i === index) {
          tab.classList.add('active');
          contents[i].classList.add('active');
          if (i === 2) loadRecords();
          if (i === 3) loadSettlement();
        } else {
          tab.classList.remove('active');
          contents[i].classList.remove('active');
        }
      });
    }

    function handleAddRecord(event) {
      event.preventDefault();
      var messageDiv = document.getElementById('addMessage');
      var amount = parseFloat(document.getElementById('amount').value);
      var item = document.getElementById('item').value.trim();
      var note = document.getElementById('note').value.trim();
      if (!isFinite(amount) || toCents(amount) === 0) {
        messageDiv.innerHTML = '<div class="message error">金額不能為 0</div>';
        return;
      }
      if (!item) {
        messageDiv.innerHTML = '<div class="message error">請輸入項目說明</div>';
        return;
      }
      var records = getRecords();
      records.push(buildRecord(amount, item, note));
      if (!saveRecords(records)) return;
      messageDiv.innerHTML = '<div class="message success">✅ 記錄已成功新增</div>';
      document.getElementById('addForm').reset();
      setTimeout(function() { messageDiv.innerHTML = ''; }, 2000);
    }

    function loadRecords() {
      var container = document.getElementById('recordsContainer');
      var records = getRecords();
      if (records.length === 0) {
        container.innerHTML = '<div class="loading">目前沒有任何記錄</div>';
        return;
      }
      var html = '<div class="records-count">共 ' + records.length + ' 筆記錄</div>';
      records.slice().reverse().forEach(function(record) {
        var date = new Date(record.date);
        var dateStr = date.toLocaleDateString('zh-TW') + ' ' + date.toLocaleTimeString('zh-TW', {hour: '2-digit', minute: '2-digit'});
        var isGirlfriendPaid = record.payer === GIRLFRIEND_NAME;
        var cardClass = isGirlfriendPaid ? 'paid-by-girlfriend' : 'paid-by-you';
        var amountClass = isGirlfriendPaid ? 'amount-positive' : 'amount-negative';
        var sign = isGirlfriendPaid ? '+' : '-';
        html += '<div class="record-card ' + cardClass + '">';
        html += '<div class="record-header">';
        html += '<div class="record-title">' + escapeHtml(record.item) + '</div>';
        html += '<div class="record-amount ' + amountClass + '">' + sign + '$' + formatCents(toCents(record.amount)) + '</div>';
        html += '</div>';
        html += '<div class="record-details">';
        html += '<div>📅 ' + escapeHtml(dateStr) + '</div>';
        html += '<div>💳 ' + escapeHtml(record.payer) + ' 付款</div>';
        if (record.note) { html += '<div>📝 ' + escapeHtml(record.note) + '</div>'; }
        html += '</div>';
        html += '<button class="btn-delete" onclick="deleteRecord(\'' + escapeHtml(record.id) + '\')">刪除</button>';
        html += '</div>';
      });
      container.innerHTML = html;
    }

    function deleteRecord(id) {
      var records = getRecords();
      var target = records.filter(function(r) { return r.id === id; })[0];
      if (!target) return;
      if (!confirm('確定要刪除「' + target.item + '」這筆記錄嗎？')) return;
      saveRecords(records.filter(function(r) { return r.id !== id; }));
      loadRecords();
    }

    function loadSettlement() {
      var container = document.getElementById('settlementContainer');
      var result = calculateSettlement();
      if (result.count === 0) {
        container.innerHTML = '<div class="loading">目前沒有任何記錄</div>';
        return;
      }
      var html = '<div class="balance-summary">';
      if (result.net > 0) {
        html += '<div class="balance-text">你欠女友</div>';
      } else if (result.net < 0) {
        html += '<div class="balance-text">女友欠你</div>';
      } else {
        html += '<div class="balance-text">已結清</div>';
      }
      html += '<div class="balance-amount">$' + formatCents(result.net) + '</div>';
      html += '</div>';
      html += '<div class="stats-grid">';
      html += '<div class="stat-card girlfriend"><h3>女友總共付（' + result.girlfriendCount + ' 筆）</h3>';
      html += '<div class="value">$' + formatCents(result.girlfriendPaid) + '</div></div>';
      html += '<div class="stat-card you"><h3>你總共付（' + result.youCount + ' 筆）</h3>';
      html += '<div class="value">$' + formatCents(result.youPaid) + '</div></div>';
      html += '</div>';
      html += '<div class="hint" style="margin-top:20px;">計算方式：女友總共付 $' + formatCents(result.girlfriendPaid) +
        ' − 你總共付 $' + formatCents(result.youPaid) + ' = ' + (result.net < 0 ? '−' : '') + '$' + formatCents(result.net) + '</div>';
      container.innerHTML = html;
    }

    function clearRecords() {
      if (!confirm('確定要清除所有記錄嗎？此操作無法復原！')) return;
      localStorage.removeItem(STORAGE_KEY);
      alert('所有記錄已清除');
      loadRecords();
    }

    // ---------- 批量導入 ----------

    // 統一全形/特殊符號：全形數字、全形 ＋－＄、Unicode 減號等
    function normalizeLine(line) {
      if (line.normalize) line = line.normalize('NFKC');
      return line.replace(/[−‒–—➖﹣]/g, '-').trim();
    }

    // 解析一行，回傳 { type: 'record' | 'skip' | 'error', ... }
    function parseBatchLine(rawLine) {
      var line = normalizeLine(rawLine);
      if (!line) return { type: 'blank' };

      // LINE 匯出格式：「時間<Tab>名字<Tab>訊息」→ 只取訊息
      if (line.indexOf('\t') !== -1) {
        var parts = line.split('\t').map(function(s) { return s.trim(); }).filter(Boolean);
        line = parts[parts.length - 1] || '';
      }
      // 去掉開頭的時間，例如「下午12:30 」「12:30 」
      line = line.replace(/^(?:(?:上午|下午|早上|中午|晚上|AM|PM)\s*)?\d{1,2}:\d{2}(?::\d{2})?\s+/i, '');

      // 日期分隔行 / LINE 檔頭，例如「2024/11/08（五）」「2024.11.08 星期五」「[LINE] ...」「儲存日期：...」
      if (/^\d{4}\s*[\/.\-年]\s*\d{1,2}\s*[\/.\-月]\s*\d{1,2}/.test(line) ||
          /^\[LINE\]/i.test(line) || /^儲存日期/.test(line)) {
        return { type: 'skip' };
      }

      // 金額：可帶 +/-、$、千分位逗號、小數，後面可接「元」「塊」
      var m = line.match(/^([+-]?)\s*\$?\s*(\d{1,3}(?:,\d{3})+|\d+)(\.\d+)?\s*(?:元|塊)?\s*(.*)$/);
      if (!m) return { type: 'error', reason: '開頭不是金額' };

      var amount = parseFloat(m[2].replace(/,/g, '') + (m[3] || ''));
      if (m[1] === '-') amount = -amount;
      var item = m[4].replace(/^[\s:：,，、\-]+/, '').trim();

      if (toCents(amount) === 0) return { type: 'error', reason: '金額為 0' };
      if (!item) return { type: 'error', reason: '缺少項目說明' };
      return { type: 'record', amount: amount, item: item };
    }

    function handleBatchImport() {
      var input = document.getElementById('batchInput').value;
      var messageDiv = document.getElementById('batchMessage');
      var previewDiv = document.getElementById('batchPreview');
      if (!input.trim()) { messageDiv.innerHTML = '<div class="message error">請貼上記錄內容</div>'; return; }

      var records = [];
      var errors = [];
      var skipped = 0;
      input.split(/\r?\n/).forEach(function(line, index) {
        var parsed = parseBatchLine(line);
        if (parsed.type === 'record') {
          records.push({ amount: parsed.amount, item: parsed.item, line: index + 1 });
        } else if (parsed.type === 'skip') {
          skipped++;
        } else if (parsed.type === 'error') {
          errors.push('第 ' + (index + 1) + ' 行（' + parsed.reason + '）：' + escapeHtml(line.trim()));
        }
      });

      if (records.length === 0) {
        messageDiv.innerHTML = '<div class="message error">沒有找到有效的記錄</div>';
        if (errors.length > 0) messageDiv.innerHTML += '<div class="message error">' + errors.join('<br>') + '</div>';
        previewDiv.innerHTML = '';
        window.batchRecords = null;
        return;
      }

      // 檢查是否已經導入過（相同金額 + 相同項目），預設不勾選
      var existingCount = {};
      getRecords().forEach(function(r) {
        var k = recordKey(r);
        existingCount[k] = (existingCount[k] || 0) + 1;
      });
      var dupCount = 0;
      records.forEach(function(r) {
        var k = recordKey(r);
        if (existingCount[k] > 0) {
          existingCount[k]--;
          r.duplicate = true;
          dupCount++;
        }
      });

      var ph = '<div style="margin:20px 0;"><h3>解析出 ' + records.length + ' 筆記錄</h3>';
      if (dupCount > 0) {
        ph += '<div class="message warning">⚠️ 有 ' + dupCount + ' 筆跟現有記錄相同（金額和項目都一樣），可能已經導入過，預設不勾選。' +
          '如果確定是新的消費，請手動勾選。</div>';
      }
      ph += '<div class="batch-list">';
      records.forEach(function(r, i) {
        var girlfriendPaid = r.amount > 0;
        var sign = girlfriendPaid ? '+' : '-';
        var color = girlfriendPaid ? '#ff6b9d' : '#28a745';
        ph += '<label class="batch-row' + (r.duplicate ? ' duplicate' : '') + '">';
        ph += '<input type="checkbox" class="batch-check" data-index="' + i + '"' + (r.duplicate ? '' : ' checked') + ' onchange="updateBatchSummary()"> ';
        ph += '<span style="color:' + color + ';font-weight:bold;">' + sign + '$' + formatCents(toCents(r.amount)) + '</span> ';
        ph += '<span>' + escapeHtml(r.item) + '</span>';
        ph += ' <span style="color:#666;">(' + (girlfriendPaid ? GIRLFRIEND_NAME : YOUR_NAME) + ' 付款)</span>';
        if (r.duplicate) ph += ' <span class="dup-tag">可能重複</span>';
        ph += '</label>';
      });
      ph += '</div>';
      ph += '<div id="batchSummary" class="hint"></div>';
      if (skipped > 0) {
        ph += '<div class="hint" style="margin-top:10px;">已自動略過 ' + skipped + ' 行日期 / 標題</div>';
      }
      if (errors.length > 0) {
        ph += '<div class="message error" style="margin-top:10px;">有 ' + errors.length + ' 行無法辨識，不會導入：<br>' + errors.slice(0, 10).join('<br>');
        if (errors.length > 10) ph += '<br>...還有 ' + (errors.length - 10) + ' 行';
        ph += '</div>';
      }
      ph += '<button class="btn" id="confirmBatchBtn" onclick="confirmBatchImport()">確認導入</button>';
      ph += '<button class="btn btn-secondary" onclick="cancelBatchImport()">取消</button></div>';
      previewDiv.innerHTML = ph;
      messageDiv.innerHTML = '';
      window.batchRecords = records;
      updateBatchSummary();
    }

    function getSelectedBatchRecords() {
      var records = window.batchRecords || [];
      var selected = [];
      document.querySelectorAll('.batch-check').forEach(function(cb) {
        if (cb.checked) selected.push(records[Number(cb.getAttribute('data-index'))]);
      });
      return selected.filter(Boolean);
    }

    function updateBatchSummary() {
      var summaryDiv = document.getElementById('batchSummary');
      if (!summaryDiv) return;
      var selected = getSelectedBatchRecords();
      var gf = 0, you = 0;
      selected.forEach(function(r) {
        var c = toCents(r.amount);
        if (c > 0) gf += c; else you += -c;
      });
      var before = calculateSettlement().net;
      var after = before + gf - you;
      function describe(net) {
        if (net > 0) return '你欠女友 $' + formatCents(net);
        if (net < 0) return '女友欠你 $' + formatCents(net);
        return '已結清';
      }
      summaryDiv.innerHTML = '將導入 <strong>' + selected.length + '</strong> 筆：女友付 $' + formatCents(gf) +
        '，你付 $' + formatCents(you) + '<br>導入前：' + describe(before) + ' → 導入後：<strong>' + describe(after) + '</strong>';
      var btn = document.getElementById('confirmBatchBtn');
      if (btn) btn.disabled = selected.length === 0;
    }

    function confirmBatchImport() {
      var selected = getSelectedBatchRecords();
      // 先清掉，避免連點導致重複導入
      window.batchRecords = null;
      var btn = document.getElementById('confirmBatchBtn');
      if (btn) btn.disabled = true;
      if (selected.length === 0) return;

      var messageDiv = document.getElementById('batchMessage');
      var previewDiv = document.getElementById('batchPreview');
      var batchId = genId();
      var records = getRecords();
      selected.forEach(function(r) { records.push(buildRecord(r.amount, r.item, '', batchId)); });
      if (!saveRecords(records)) return;

      messageDiv.innerHTML = '<div class="message success">成功導入 ' + selected.length + ' 筆記錄！' +
        ' <button class="btn-link" onclick="undoBatch(\'' + batchId + '\')">撤銷這次導入</button></div>';
      previewDiv.innerHTML = '';
      document.getElementById('batchInput').value = '';
    }

    function undoBatch(batchId) {
      var records = getRecords();
      var remaining = records.filter(function(r) { return r.batchId !== batchId; });
      var removed = records.length - remaining.length;
      if (removed === 0) return;
      if (!confirm('確定要撤銷這次導入的 ' + removed + ' 筆記錄嗎？')) return;
      saveRecords(remaining);
      document.getElementById('batchMessage').innerHTML = '<div class="message success">已撤銷 ' + removed + ' 筆記錄</div>';
    }

    function cancelBatchImport() {
      document.getElementById('batchPreview').innerHTML = '';
      document.getElementById('batchMessage').innerHTML = '';
      window.batchRecords = null;
    }

    window.onload = function() {
      // 預覽後又修改了貼上內容 → 預覽作廢，避免導入舊內容
      document.getElementById('batchInput').addEventListener('input', function() {
        if (window.batchRecords) cancelBatchImport();
      });
      loadRecords();
    };
  </script>
</body>
</html>
